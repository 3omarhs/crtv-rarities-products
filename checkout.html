<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Creative Rarities Store</title>
    <meta name="description" content="Checkout to complete your order.">
    <link rel="icon" type="image/png" href="logo.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- PapaParse (Required for app.js) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <!-- Fuse.js (Required for app.js) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/7.1.0/fuse.min.js"></script>

    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <link rel="stylesheet" href="style.css?v=2.0">

    <style>
        body {
            background-color: #f8fafc;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .page-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--accent);
        }

        /* Standalone Checkout Styling */
        .checkout-standalone-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--card-border);
            padding: 2rem;
            min-height: 500px;
        }

        .checkout-progress {
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 1rem;
        }
    </style>
</head>

<body>
    <div class="background-glob"></div>

    <main class="container">
        <a href="index.html" class="back-link">
            <i data-lucide="arrow-left" style="width: 16px;"></i> <span id="back-to-store">Back to Store</span>
        </a>

        <div class="page-header">
            <h1 id="checkout-title-page">Checkout</h1>
        </div>

        <div class="checkout-standalone-card">
            <div class="checkout-progress">
                <div class="step active" data-step="1">1. Info</div>
                <div class="step" data-step="2">2. Delivery</div>
                <div class="step" data-step="3">3. Review</div>
            </div>

            <div class="checkout-body">
                <!-- Step 1: Contact Info -->
                <div id="checkout-step-1" class="checkout-step active">
                    <h4>Contact Information</h4>
                    <div class="form-group">
                        <label for="cx-name">Full Name</label>
                        <input type="text" id="cx-name" class="form-input" placeholder="Enter your name">
                    </div>
                    <div class="form-group">
                        <label for="cx-phone">Phone Number</label>
                        <div class="phone-input-wrapper">
                            <span class="country-code">+962</span>
                            <input type="tel" id="cx-phone" class="form-input" placeholder="7XXXXXXXX" maxlength="9">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="cx-email">Email Address <span
                                style="font-size: 0.8rem; font-weight: 400; color: var(--text-secondary);">(Optional)</span></label>
                        <input type="email" id="cx-email" class="form-input" placeholder="name@example.com">
                    </div>

                    <button class="whatsapp-direct-btn" onclick="window.checkoutWhatsApp()">
                        <i data-lucide="message-circle" style="fill: white;"></i>
                        Place order using whatsapp to contact store manager
                    </button>
                </div>

                <!-- Step 2: Delivery Method -->
                <div id="checkout-step-2" class="checkout-step hidden">
                    <h4>Delivery Method</h4>
                    <div class="form-group">
                        <label for="delivery-method-select">Choose Delivery Method</label>
                        <select id="delivery-method-select" class="form-input"
                            onchange="selectDeliveryMethod(this.value)">
                            <option value="delivery" selected>Choosing a delivery region then company</option>
                            <option value="pickup">Pick from the representative</option>
                        </select>
                    </div>

                    <!-- Pickup Details -->
                    <div id="pickup-details" class="hidden"
                        style="margin-top: 1.5rem; padding: 1rem; background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 8px; color: #0369a1;">
                        <strong>Pickup Location:</strong><br>
                        Amman, Al-Hurriya Street, opposite the Department of Lands south of Amman
                    </div>

                    <!-- Dynamic Region/Company Selection -->
                    <div id="delivery-details" style="margin-top: 1.5rem;">
                        <div class="form-group">
                            <label for="cx-region">Select Region</label>
                            <select id="cx-region" class="form-input" onchange="updateDeliveryCompanies()">
                                <option value="">-- Choose Region --</option>
                                <!-- Loaded dynamically -->
                            </select>
                        </div>
                        <div class="form-group" id="company-group" style="margin-top: 1rem;">
                            <label for="cx-company">Select Company</label>
                            <select id="cx-company" class="form-input" onchange="selectCompanyFromDropdown(this.value)">
                                <option value="">-- Choose Company --</option>
                                <!-- Loaded dynamically -->
                            </select>
                        </div>
                        <div class="form-group" id="address-group" style="margin-top: 1rem;">
                            <label for="cx-address">Detailed Address</label>
                            <textarea id="cx-address" class="form-input" rows="3"
                                placeholder="Enter your detailed address (City, Street, Building No., Landmark)"
                                style="resize: vertical;"></textarea>
                        </div>
                    </div>
                </div>

                <!-- Step 3: Review -->
                <div id="checkout-step-3" class="checkout-step hidden">
                    <h4>Order Summary</h4>
                    <div class="summary-box">
                        <div class="summary-row">
                            <span>Subtotal:</span>
                            <span id="summary-subtotal">0.000 JOD</span>
                        </div>
                        <div class="summary-row">
                            <span>Delivery:</span>
                            <span id="summary-delivery">0.000 JOD</span>
                        </div>
                        <div class="summary-row total">
                            <span>Total:</span>
                            <span id="summary-total">0.000 JOD</span>
                        </div>
                    </div>
                    <div class="customer-summary"
                        style="margin-top: 1.5rem; padding: 1rem; background: #f8fafc; border-radius: 8px;">
                        <p id="summary-name" style="margin: 0.2rem 0; color: var(--text-primary); text-align: center;">
                        </p>
                        <p id="summary-phone" style="margin: 0.2rem 0; color: var(--text-primary); text-align: center;">
                        </p>
                        <p id="summary-method"
                            style="margin: 0.2rem 0; color: var(--text-primary); text-align: center; font-size: 0.9rem;">
                        </p>
                    </div>
                </div>
            </div>

            <div class="modal-footer"
                style="padding-top: 2rem; margin-top: auto; border-top: 1px solid var(--card-border);">
                <button id="checkout-back-btn" class="modal-btn secondary hidden" onclick="checkoutBack()">Back</button>
                <button id="checkout-next-btn" class="modal-btn primary" onclick="checkoutNext()">Next</button>
                <button id="checkout-submit-btn" class="modal-btn primary hidden" onclick="submitOrder()">Place
                    Order</button>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <!-- app.js is needed for translations and cart logic -->
    <script src="app.js?v=1.6"></script>
    <script src="checkout.js?v=2.2"></script>
    <script>
        lucide.createIcons();
        // Setup initial view
        if (window.populateRegions) window.populateRegions();

        // Handle Back translation
        const lang = localStorage.getItem('cr_lang') || 'en';
        if (lang === 'ar') {
            document.body.classList.add('rtl');
            const backLink = document.getElementById('back-to-store');
            if (backLink) backLink.textContent = "العودة للمتجر";
            const title = document.getElementById('checkout-title-page');
            if (title) title.textContent = "إتمام الطلب";
        }
    </script>
</body>

</html>
